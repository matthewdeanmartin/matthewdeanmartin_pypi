[project]
name = "john-doe"
version = "0.1.0"
description = "Example pypi-profile plugin — a data package that publishes a profile website via pypi-profile."
readme = "README.md"
authors = [{ name = "John Doe", email = "john@example.com" }]
keywords = ["pypi", "profile", "plugin"]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pypi-profile>=0.1.0",
]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi"
homepage = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi"
issues = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi/issues/"

[project.scripts]
john-doe-profile = "pypi_profile.cli:main"

[project.entry-points."pypi_profile.plugins"]
john_doe = "john_doe"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["john_doe"]
include = [
    "john_doe/**/*.py",
    "john_doe/py.typed",
    "john_doe/pypi_profile.toml",
    "/README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "LICENSE", "/john_doe", "/tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
pypi-profile = { workspace = true }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-q --timeout=60"
norecursedirs = ["vendor", "scripts", "dist", "build"]
junit_family = "xunit1"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["john_doe", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "UP", "SIM", "RUF", "W"]
ignore = ["E501", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011", "S101"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
