---
site_name: john_doe
site_url: https://john_doe.readthedocs.io/
site_author: {{ cookiecutter.author_name }} <{{ cookiecutter.author_email }}>
site_description: john_doe
repo_url: https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.github_repo }}
theme:
  name: readthedocs
  features: [navigation.footer]
edit_uri: edit/main/docs/
markdown_extensions:
  - attr_list
  - codehilite
  - toc:
      permalink: true
nav:
  - Overview:
      - Readme.md: overview/README.md
  - Installation: installation.md
  - Usage:
      - Quick Start: usage/quickstart.md
  - Contributing: extending/CONTRIBUTING.md
  - Change Log: CHANGELOG.md
validation:
  nav:
    omitted_files: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
