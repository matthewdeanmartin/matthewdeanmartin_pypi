{% macro symbol(name, title=None, class_name="pypi-ds-symbol") -%}
  <svg class="{{ class_name }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-linecap="round"
       stroke-linejoin="round"
       stroke-width="2"
       {% if title %}
       role="img"
       {% else %}
       aria-hidden="true"
       {% endif %}>
    {% if title %}<title>{{ title }}</title>{% endif %}
    {% if name == "search" %}
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-3.5-3.5"></path>
    {% elif name == "warning" %}
      <path d="M12 3 2.5 20h19L12 3Z"></path>
      <path d="M12 9v4"></path>
      <circle cx="12" cy="17" r="1"></circle>
    {% elif name == "success" %}
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m8.5 12.5 2.5 2.5 4.5-5"></path>
    {% elif name == "info" %}
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 10v6"></path>
      <circle cx="12" cy="7" r="1"></circle>
    {% elif name == "package" %}
      <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
      <path d="m4 7.5 8 4.5 8-4.5"></path>
      <path d="M12 12v9"></path>
    {% elif name == "download" %}
      <path d="M12 4v10"></path>
      <path d="m8.5 10.5 3.5 3.5 3.5-3.5"></path>
      <path d="M4 19h16"></path>
    {% elif name == "docs" %}
      <path d="M6 4.5h9a3 3 0 0 1 3 3V19H9a3 3 0 0 0-3 3Z"></path>
      <path d="M6 4.5v17.5"></path>
    {% elif name == "external" %}
      <path d="M14 5h5v5"></path>
      <path d="M10 14 19 5"></path>
      <path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path>
    {% elif name == "home" %}
      <path d="M3 11.5 12 4l9 7.5"></path>
      <path d="M6 10.5V20h12v-9.5"></path>
    {% else %}
      <circle cx="12" cy="12" r="9"></circle>
    {% endif %}
  </svg>
{%- endmacro %}
