[project]
name = "pypi-profile"
version = "0.2.0"
description = "The missing PyPI(tm) profile page — pipx-installable, plugin-extensible. Not associated with PSF."
readme = "README.md"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["pypi", "profile", "cli"]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pluggy>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "prompt-toolkit>=3.0.0",
    "keyring>=25.7.0",
    "py-minisign>=0.13.2",
    "schema-resume-validator>=1.1.0",
]

[project.optional-dependencies]
fetch = []
build = []
all = []
# sign extra kept for backwards compatibility; keyring and py-minisign are now core deps
sign = []

[project.urls]
Repository = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi"
homepage = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi"
issues = "https://github.com/matthewdeanmartin/matthewdeanmartin_pypi/issues/"
Documentation = "https://matthewdeanmartin-pypi.readthedocs.io/en/latest/"

[project.scripts]
pypi-profile = "pypi_profile.cli:main"
pypi-profile-gui = "pypi_profile.gui:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pypi_profile"]
include = [
    "pypi_profile/**/*.py",
    "pypi_profile/**/*.html",
    "pypi_profile/**/*.css",
    "pypi_profile/**/*.js",
    "pypi_profile/**/*.ico",
    "pypi_profile/**/*.svg",
    "pypi_profile/**/*.png",
    "pypi_profile/**/*.jpg",
    "pypi_profile/py.typed",
    "/README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "LICENSE", "/pypi_profile", "/tests"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "bandit>=1.9.4",
    "black>=26.0.0",
    "isort>=6.0.0",
    "jiggle-version>=2.1.0",
    "codespell>=2.4.1",
    "mdformat>=1.0.0",
    "metametameta>=0.1.5",
    "mypy>=1.18.0",
    "pylint[spelling]>=4.0.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.100.0",
    "ruff>=0.12.0",
    "troml-dev-status>=0.6.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "tox>=4.0",
    "tox-uv>=1.0",
    "gha-update>=0.1.0; python_version >= '3.12'",
    "pyyaml>=6.0",
    "yamlfix>=1.19.0",
    "interrogate>=1.5.0",
    "linkcheckmd>=1.4.0",
    "pyenchant>=3.2.2",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.26.0",
    "git2md>=0.1.0",
    "pyclean>=3.0.0",
    "vulture>=2.11",
    "deadcode>=2.4.0",
    "griffe>=1.0.0",
    "pydoclint>=0.8.0; python_version >= '3.10'",
    "pydoctest==0.2.1",
    "refurb>=2.0.0; python_version >= '3.10'",
    "crosshair-tool>=0.0.80; python_version >= '3.10'",
    "deptry>=0.20.0",
    "import-linter>=2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-q --timeout=60"
norecursedirs = ["vendor", "scripts", "dist", "build"]
markers = [
    "slow: performance benchmarks (run with -m slow)",
    "integration: integration tests (run with -m integration)",
]
junit_family = "xunit1"

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs | \.git | \.hg | \.mypy_cache | \.tox | \.venv
    | _build | buck-out | build | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pypi_profile", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "UP", "SIM", "RUF", "W"]
ignore = ["E501", "UP007", "RUF001", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError",
    "except ModuleNotFoundError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.importlinter]
root_packages = ["pypi_profile"]
