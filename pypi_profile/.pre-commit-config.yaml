---
ci:
  autoupdate_schedule: quarterly
  autofix_commit_msg: |
    [pre-commit.ci] Apply automatic pre-commit fixes

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-builtin-literals
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: forbid-new-submodules

  # Mirrors `make fix` exactly: isort -> black -> ruff --fix -> black.
  # Explicit config paths required: pre-commit runs from repo root and this
  # is a monorepo sub-package — without them tools fall back to defaults
  # (79-char lines etc.) and oscillate commit-to-commit.
  # files: scoped to this package only so ruff errors in sibling packages
  # don't block commits here.
  - repo: local
    hooks:
      - id: fix
        name: fix (isort + black + ruff + black)
        language: system
        entry: bash -c 'uv run isort --settings-path pypi_profile/ "$@" && uv run black --config pypi_profile/pyproject.toml "$@" && uv run ruff check --fix --quiet --config pypi_profile/pyproject.toml "$@" && uv run black --config pypi_profile/pyproject.toml "$@"' --
        types: [python]
        files: ^pypi_profile/
        pass_filenames: true

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
        files: ^pypi_profile/
      - id: python-no-log-warn
        files: ^pypi_profile/
      - id: text-unicode-replacement-char
        files: ^pypi_profile/
