---
site_name: pypi-profile
site_url: https://pypi-profile.readthedocs.io/
site_description: The missing PyPI profile page for Python package publishers.
repo_url: https://github.com/matthewdeanmartin/matthewdeanmartin_pypi
theme:
  name: readthedocs
  features: [navigation.footer]
edit_uri: edit/main/docs/
markdown_extensions:
  - attr_list
  - codehilite
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start:
      - GUI: gui.md
      - CLI: quickstart.md
  - Usage: basic-usage.md
  - Key Management: key-management.md
  - Advanced Usage:
      - Pluggy Plugins: advanced-usage.md
      - JSON Resume Import: skills/json-resume.md
  - Signing and Verification: signing.md
  - Troubleshooting: troubleshooting.md
  - Security: security.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
validation:
  nav:
    omitted_files: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
plugins:
  - search
