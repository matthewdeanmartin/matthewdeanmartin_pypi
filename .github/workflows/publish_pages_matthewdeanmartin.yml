---
name: Publish matthewdeanmartin profile to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_pages_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install workspace dependencies (from source, no PyPI publish required)
        run: uv sync --all-extras

      - name: Build static site
        run: |
          uv run pypi-profile build \
            matthewdeanmartin/matthewdeanmartin/pypi_profile.toml \
            --output dist \
            --resume-file matthewdeanmartin/resume.json \
            --base-url /matthewdeanmartin_pypi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
