---
name: Publish matthewdeanmartin profile to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_pages_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install workspace dependencies (from source, no PyPI publish required)
        run: uv sync --all-extras

      - name: Build static site
        run: |
          uv run pypi-profile build \
            matthewdeanmartin/matthewdeanmartin/pypi_profile.toml \
            --output dist \
            --resume-file matthewdeanmartin/resume.json \
            --base-url /matthewdeanmartin_pypi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
