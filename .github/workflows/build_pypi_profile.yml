---
name: Build pypi_profile

on:
  push:
    paths:
      - ".github/workflows/build_pypi_profile.yml"
      - ".github/workflows/publish_pypi_profile.yml"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "john_doe/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/build_pypi_profile.yml"
      - ".github/workflows/publish_pypi_profile.yml"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "john_doe/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi_profile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        run: uv sync
      - name: Run quality gates
        run: uv run make check-ci
      - name: Build distribution
        run: uv build

  python315:
    name: Python 3.15 final / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_NO_BUILD: "1"
      UV_NO_CACHE: "1"
      UV_PRERELEASE: disallow
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
          allow-prereleases: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.0"
      - name: Create final interpreter environment
        run: |
          uv venv --python 3.15.0 .venv315
          if [ "$RUNNER_OS" = Windows ]; then
            echo "PROFILE_PYTHON=$GITHUB_WORKSPACE/.venv315/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "PROFILE_PYTHON=$GITHUB_WORKSPACE/.venv315/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install wheel-published build and test tools
        run: |
          uv pip install --python "$PROFILE_PYTHON" --only-binary :all: -r .github/requirements/python315-tests.txt
      - name: Build the project's pure-Python wheel
        run: uv build --wheel --no-build-isolation --python "$PROFILE_PYTHON" --package pypi-profile --out-dir dist315
      - name: Install application with stable dependency wheels
        run: |
          uv pip install --python "$PROFILE_PYTHON" --only-binary :all: dist315/*.whl
      - name: Assert final interpreter and portable backends
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python "$PROFILE_PYTHON" python -c 'import sys; from pypi_profile import serialization as s; assert sys.version_info[:3] == (3, 15, 0) and sys.version_info.releaselevel == "final"; assert s.JSON_BACKEND == "json" and s.TOML_BACKEND == "tomllib"'
          uv run --no-project --python "$PROFILE_PYTHON" pypi-profile --help
          uv run --no-project --python "$PROFILE_PYTHON" pypi-profile --version
      - name: Run application tests
        working-directory: pypi_profile
        run: uv run --no-project --python "$PROFILE_PYTHON" python -m pytest tests --tb=short
