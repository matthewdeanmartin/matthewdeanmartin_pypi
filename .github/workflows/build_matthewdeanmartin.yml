---
name: Build matthewdeanmartin

on:
  push:
    paths:
      - ".github/workflows/build_matthewdeanmartin.yml"
      - ".github/workflows/publish_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/build_matthewdeanmartin.yml"
      - ".github/workflows/publish_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matthewdeanmartin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Run quality gates
        run: uv run make check-ci
      - name: Build distribution
        run: uv build
