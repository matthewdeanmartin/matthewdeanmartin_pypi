---
name: Build matthewdeanmartin

on:
  push:
    paths:
      - ".github/workflows/build_matthewdeanmartin.yml"
      - ".github/workflows/publish_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/build_matthewdeanmartin.yml"
      - ".github/workflows/publish_matthewdeanmartin.yml"
      - "matthewdeanmartin/**"
      - "pypi_profile/**"
      - "pypi_ds/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matthewdeanmartin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync
      - name: Run quality gates
        run: uv run make check-ci
      - name: Build distribution
        run: uv build
